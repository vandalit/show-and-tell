services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: show_and_tell
      POSTGRES_USER: show_and_tell
      POSTGRES_PASSWORD: local_dev_only
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U show_and_tell -d show_and_tell"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
